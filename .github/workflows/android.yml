name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and assemble
        run: ./gradlew testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug assembleRelease --stacktrace

      - name: Inspect release and prepare signing tools
        run: |
          mkdir -p release-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release-tools/
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > release-tools/manifest.txt
          if grep -q application-debuggable release-tools/manifest.txt; then
            echo "Release APK must not be debuggable"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-counter-ci
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/mapping/release/
            app/build/reports/
            app/build/test-results/
            release-tools/
