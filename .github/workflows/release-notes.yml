name: Release notes

on:
  push:
    branches: [main]
    paths: ['docs/releases/*.md']

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out documentation
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update published release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'docs/releases/*.md' |
          while IFS= read -r notes; do
            version="$(basename "$notes" .md)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            tag="v$version"
            releases="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')"
            if ! grep -Fxq "$tag" <<< "$releases"; then
              echo "No published release for $tag; leaving notes in the repository."
              continue
            fi
            gh release edit "$tag" --notes-file "$notes"
          done
