name: Publish verified 1.0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-1.0.1.yml'
      - 'scripts/releases/**'
      - 'docs/releases/1.0.1.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-1.0.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download tested build
        run: gh run download 35444505784 --name offline-counter-ci --dir verified-ci
      - name: Restore and verify the existing signed APK
        run: |
          mkdir release-output
          python3 scripts/releases/restore_apk.py verified-ci/app/build/outputs/apk/release/app-release-unsigned.apk scripts/releases/1.0.1.transport release-output/Offline-Counter-1.0.1-release.apk
          java -jar verified-ci/release-tools/apksigner.jar verify --verbose --print-certs release-output/Offline-Counter-1.0.1-release.apk > release-output/signature.txt
          grep -q 'a5893bf52d538eb8b24c683e10aaae3fcf7627355df56d4bded4ece1451c1c79' release-output/signature.txt
          cd release-output
          sha256sum Offline-Counter-1.0.1-release.apk > SHA256SUMS.txt
      - name: Publish release without replacing existing assets
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            mkdir published
            gh release download v1.0.1 --pattern Offline-Counter-1.0.1-release.apk --dir published
            cmp release-output/Offline-Counter-1.0.1-release.apk published/Offline-Counter-1.0.1-release.apk
          else
            gh release create v1.0.1 release-output/Offline-Counter-1.0.1-release.apk release-output/SHA256SUMS.txt release-output/signature.txt --target c2f4d24cff31c50889e9b147521d7932f196ec70 --title "Оффлайн-счётчик 1.0.1" --notes-file docs/releases/1.0.1.md --draft
            gh release edit v1.0.1 --draft=false --latest
          fi
          gh release view v1.0.1 --json url,isDraft,tagName,assets
